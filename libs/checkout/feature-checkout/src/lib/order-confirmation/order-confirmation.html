<main class="cl-page cl-confirmation-page">
  <section class="cl-confirmation-card">
    <span class="cl-confirmation-card__mark" aria-hidden="true">✓</span>
    <p class="cl-eyebrow">Order received</p>
    <h1>Thank you for choosing Carat Line</h1>
    <p>
      Your order <strong>{{ orderNumber }}</strong> has been placed. Our concierge will contact you
      before your piece leaves the atelier.
    </p>
    <div class="cl-confirmation-card__details">
      <div><span>Payment</span><strong>Cash on delivery</strong></div>
      <div><span>Delivery</span><strong>Insured &amp; tracked</strong></div>
    </div>
    <a class="cl-button cl-button--dark" routerLink="/products">Continue exploring</a>
    <a class="cl-text-link" routerLink="/">Return home</a>
  </section>
</main>
